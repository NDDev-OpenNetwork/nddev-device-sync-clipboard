[package]
name = "nddev-device-sync-clipboard"
version = "0.0.1-alpha.3"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-clipboard"

[dependencies]
serde = { version = "1", features = ["derive"] }
zeroize = "1.8"
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
thiserror = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.1", git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-agent", rev = "341644980976a08825b194f147b7534321325785" }
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "android")'.dependencies]
nddev-device-sync-accounts = { version="=0.0.1-alpha.18", git="https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts", rev="b9c1b4c3756f2a5976c5f3aaf6371901a627fa3e" }
jni = "0.21.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
